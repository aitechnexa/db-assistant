# PostgreSQL configuration for low memory environment (1GB total)
# Place this in your postgres data directory or use command line args

# Memory Settings
shared_buffers = 64MB                   # Reduced from 128MB
effective_cache_size = 256MB            # Estimate for OS cache
work_mem = 4MB                          # Per sort/hash operation
maintenance_work_mem = 32MB             # For VACUUM, CREATE INDEX

# Connection Settings
listen_addresses = '*'                  # Accept connections from all interfaces
max_connections = 20                    # Reduced from 100

# Checkpoint Settings - less frequent writes to reduce I/O
wal_buffers = 4MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 256MB
min_wal_size = 64MB

# Query Planner - conservative for low memory
random_page_cost = 4.0
effective_io_concurrency = 1

# Logging - minimal for production
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_connections = off
log_disconnections = off
log_checkpoints = off

# Autovacuum - keep on but less aggressive
autovacuum_max_workers = 1
autovacuum_naptime = 1min
