version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: db-assistant-postgres
    environment:
      - POSTGRES_USER=dbassistant
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dbassistant
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - db-assistant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbassistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: db-assistant-backend
    ports:
      - "5010:5010"
    environment:
      - DATABASE_ENCRYPTION_KEY=${DATABASE_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://dbassistant:${POSTGRES_PASSWORD}@postgres:5432/dbassistant
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - SCHEMA_CACHE_TTL=${SCHEMA_CACHE_TTL:-1800}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
    command: /app/start.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-assistant-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: db-assistant-frontend
    ports:
      - "5020:5020"
    depends_on:
      - backend
    networks:
      - db-assistant-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 32M
    restart: unless-stopped

networks:
  db-assistant-network:
    driver: bridge

volumes:
  app_data:
  postgres_data:
