# Nginx configuration for DB Assistant

server {
    listen 80;
    server_name db-assistant.aitechnexa.com;

    # Logs
    access_log /var/log/nginx/db-assistant-access.log;
    error_log /var/log/nginx/db-assistant-error.log;

    # Max upload size
    client_max_body_size 50M;

    # Backend API Proxy (FastAPI)
    location /api/ {
        proxy_pass http://localhost:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Docs
    location /docs {
        proxy_pass http://localhost:5010/docs;
    }

    location /redoc {
        proxy_pass http://localhost:5010/redoc;
    }

    location /openapi.json {
        proxy_pass http://localhost:5010/openapi.json;
    }

    # Frontend (React/Vite)
    location / {
        proxy_pass http://localhost:5020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
